services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      # Host port 8080 forwards to container port 80
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      instance-1:
        condition: service_healthy
      instance-2:
        condition: service_healthy
      instance-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # Backend Instance 1 (builds and tags the shared backend image)
  instance-1:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: node-backend:latest
    container_name: backend-instance-1
    restart: unless-stopped
    environment:
      - INSTANCE_NAME=instance-1
      - PORT=3000
    expose:
      # Internal to Docker network only; not mapped to host
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # Backend Instance 2 (reuses the shared backend image)
  instance-2:
    image: node-backend:latest
    container_name: backend-instance-2
    restart: unless-stopped
    environment:
      - INSTANCE_NAME=instance-2
      - PORT=3000
    expose:
      # Internal to Docker network only; not mapped to host
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # Backend Instance 3 (reuses the shared backend image)
  instance-3:
    image: node-backend:latest
    container_name: backend-instance-3
    restart: unless-stopped
    environment:
      - INSTANCE_NAME=instance-3
      - PORT=3000
    expose:
      # Internal to Docker network only; not mapped to host
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

networks:
  app-network:
    name: reverse_proxy_app_network
    driver: bridge
