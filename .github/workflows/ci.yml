
name: Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the backend image from the current source code.
      - name: Build Docker images
        run: docker compose build

      # Start Nginx and all backend instances.
      - name: Start containers
        run: docker compose up -d --no-build

      # Wait until all three backend containers and Nginx are healthy.
      - name: Wait for all containers to become healthy
        shell: bash
        run: |
          set -e

          containers=(
            backend-instance-1
            backend-instance-2
            backend-instance-3
            reverse-proxy
          )

          for i in {1..30}; do
            all_healthy=true

            for container in "${containers[@]}"; do
              status=$(docker inspect \
                --format '{{.State.Health.Status}}' \
                "$container" 2>/dev/null || echo "missing")

              if [ "$status" != "healthy" ]; then
                all_healthy=false
                break
              fi
            done

            if [ "$all_healthy" = true ]; then
              echo "All containers are healthy."
              docker compose ps
              exit 0
            fi

            sleep 2
          done

          echo "Not all containers became healthy."
          docker compose ps
          exit 1

      - name: Test Nginx health endpoint
        run: curl --fail --retry 3 --retry-delay 2 http://localhost:8080/nginx-health

      - name: Test backend through Nginx
        run: |
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/
          curl --fail --retry 3 --retry-delay 2 http://localhost:8080/health

      # Publish only after successful tests on a push to main.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested backend image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push zibranhasan/docker-reverse-proxy:latest

      - name: Show logs if a step fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down
