
name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Use a temporary Ubuntu machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for containers to become healthy
        run: |
          for i in {1..30}; do
            if docker compose ps --format json | grep -q '"Health":"healthy"'; then
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Test Nginx health endpoint
        run: curl --fail http://localhost:8080/nginx-health

      - name: Test backend through Nginx
        run: |
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/health

      # Publish only on pushes to main, not pull requests
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag node-backend:latest zibranhasan/docker-reverse-proxy:latest

      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push zibranhasan/docker-reverse-proxy:latest

      - name: Show logs if a step fails
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
