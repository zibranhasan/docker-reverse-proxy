events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Access log format including upstream server and response timing
    log_format proxy_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'upstream: $upstream_addr ($upstream_response_time s) '
                         'host: "$http_host" user_agent: "$http_user_agent"';

    access_log /var/log/nginx/access.log proxy_log;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend pool using Docker service names
    # By default, Nginx distributes requests across these servers using Round Robin
    upstream node_backend {
        server instance-1:3000 max_fails=3 fail_timeout=10s;
        server instance-2:3000 max_fails=3 fail_timeout=10s;
        server instance-3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        # Listen on port 80 inside the container
        listen 80;
        server_name localhost;

        # Timeouts for connecting to and receiving responses from backends
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Health check endpoint for the Nginx reverse proxy itself
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-reverse-proxy"}\n';
        }

        # Forward all incoming traffic to the backend instances
        # (This forwards /, /health, /info, and any other application route)
        location / {
            proxy_pass http://node_backend;

            # Enable HTTP 1.1 keep-alive between Nginx and backends
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward standard client headers to backend instances
            # Note: in Nginx, defining any proxy_set_header in location overrides
            # parent headers, so all forwarding headers are defined here together.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fault tolerance: if a backend instance returns an error or times out,
            # failover to the next available backend instance transparently
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
